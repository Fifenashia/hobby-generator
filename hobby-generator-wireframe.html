<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobby Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 id="title">The Hobby Generator</h1>
        <nav>
            <a href ="">About the project</a>
            <a href ="">Additional Resources</a>
        </nav>
    </header>

    <Main class="" >
        <h2>New Hobby Generator</h2>
        <p>A brain-friendly hobby generator for when choosing feels hard.</p>
        
        <label for="categorySelect">Category:</label>
        <select id="categorySelect">
            <option value="All">All</option>
            <option value="Creative">Creative</option>
            <option value="Outdoors">Outdoors</option>
            <option value="Brainy">Brainy</option>
            <option value="Cozy">Cozy</option>
        </select>

        <label for="timeSelect">Time:</label>
        <select id="timeSelect">
            <option value="any">Surprise me</option>
            <option value="quick">Under 5 minutes</option>
            <option value="short">Up to 30 minutes</option>
            <option value="medium">Up to 1 hour</option>
            <option value="long">Any duration</option>
        </select>

        <button id="spinBtn">Find 3 Hobbies</button>
            <ul id="hobbyList">
                <li>Pick a category and click the button</li>
            </ul>
    </Main>
    <script src="script.js"></script>
</body>


    <footer>2025</footer>

</html>
